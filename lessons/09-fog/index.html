<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 09: フォグ — Three.js Lab</title>
    <link rel="stylesheet" href="/src/shared/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1><a href="../../index.html">Three.js Lab</a></h1>
      <span class="badge">Lesson 09</span>
    </header>

    <main class="layout lesson-layout">
      <aside class="panel">
        <h2>フォグ</h2>
        <ul class="concepts">
          <li><strong>Fog</strong> … near / far で線形に霞む</li>
          <li><strong>FogExp2</strong> … density で指数減衰</li>
          <li>scene.fog に設定（背景色と揃えると自然）</li>
        </ul>
        <p class="notice">奥行きの空気感を足す定番テクニックです。種別とパラメータを変えて差を見てみましょう。</p>
        <div class="controls">
          <div class="control-row">
            <label for="fog-type">種別</label>
            <select id="fog-type">
              <option value="Fog" selected>Fog (線形)</option>
              <option value="FogExp2">FogExp2 (指数)</option>
            </select>
          </div>
          <div class="control-row" id="near-row">
            <label for="near">near</label>
            <input type="range" id="near" min="1" max="20" step="0.5" value="4" />
          </div>
          <div class="control-row" id="far-row">
            <label for="far">far</label>
            <input type="range" id="far" min="5" max="40" step="0.5" value="18" />
          </div>
          <div class="control-row" id="density-row" hidden>
            <label for="density">density</label>
            <input type="range" id="density" min="0.01" max="0.2" step="0.005" value="0.06" />
          </div>
        </div>
        <nav class="nav-lessons">
          <a href="../08-raycaster/index.html">← 前のレッスン</a>
          <a href="../10-particles/index.html">次のレッスン →</a>
        </nav>
      </aside>

      <div class="canvas-wrap" id="canvas-wrap">
                <div class="hint">ドラッグで視点変更</div>
      </div>
    </main>

    <script type="module" src="/src/lessons/09-fog.ts"></script>
  </body>
</html>
